<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 600" width="512" height="600" id="kielipukki-rig">
  <!--
    Kielipukki character rig.

    Coordinate system: the goat head is drawn in a 512 x 600 box (same size as
    assets/goat/reference.png). The hands and props use the same units, so they
    stay in proportion when the controller scales the whole character.

    Naming:
      #goat ................ the whole head; everything inside moves with it
      [data-part] .......... a movable part (ear-l, ear-r, eyes, mouth, ...)
      [data-variant] ....... one drawing of a part; the controller shows one
                             variant per part and hides the rest
      #hand-template ....... one hand with every pose; the controller copies it
      [data-pose] .......... a hand pose (open, point, grip, thumbs-up)
      #props-library ....... sample props; each has data-grip="x y", the point
                             a hand holds it by
    Pivot points for rotation are stored as data-pivot="x y".
  -->
  <defs>
    <!-- Hand silhouettes. Each is drawn twice: once with a thick black stroke
         (outline), once in white on top, so overlapping shapes merge into one
         outlined shape. Shapes have no fill or stroke of their own. -->
    <g id="hs-cuff">
      <circle cx="-44" cy="-20" r="15"/>
      <circle cx="-52" cy="0" r="16"/>
      <circle cx="-44" cy="20" r="15"/>
      <circle cx="-34" cy="-6" r="20"/>
      <circle cx="-34" cy="10" r="20"/>
    </g>
    <g id="hs-open">
      <use href="#hs-cuff"/>
      <ellipse cx="10" cy="4" rx="46" ry="31"/>
      <ellipse cx="-4" cy="-30" rx="12" ry="21" transform="rotate(-35 -4 -30)"/>
    </g>
    <g id="hs-point">
      <use href="#hs-cuff"/>
      <ellipse cx="0" cy="6" rx="34" ry="30"/>
      <rect x="6" y="-30" width="84" height="26" rx="13"/>
      <ellipse cx="4" cy="-28" rx="13" ry="16" transform="rotate(-30 4 -28)"/>
    </g>
    <g id="hs-grip-back">
      <use href="#hs-cuff"/>
      <ellipse cx="0" cy="0" rx="36" ry="32"/>
    </g>
    <g id="hs-thumbs-up">
      <use href="#hs-cuff"/>
      <ellipse cx="0" cy="6" rx="34" ry="30"/>
      <rect x="10" y="-26" width="34" height="62" rx="17"/>
      <rect x="-8" y="-76" width="26" height="58" rx="13"/>
    </g>
    <clipPath id="clip-horn-l">
      <path d="M146 140 C 132 92, 110 50, 78 18 C 74 12, 80 8, 86 10 C 160 30, 214 66, 236 128 Z"/>
    </clipPath>
    <clipPath id="clip-grin">
      <path d="M180 348 Q256 360 332 348 C 326 428, 186 428, 180 348 Z"/>
    </clipPath>
  </defs>

  <g id="goat" data-pivot="256 470">
    <!-- Horns sit behind the head. The right horn is a mirror of the left. -->
    <g data-part="horns">
      <g id="horn-l">
        <path d="M146 140 C 132 92, 110 50, 78 18 C 74 12, 80 8, 86 10 C 160 30, 214 66, 236 128 Z" fill="#808080"/>
        <g clip-path="url(#clip-horn-l)" stroke="#c9c9c9" stroke-width="14">
          <line x1="56" y1="122" x2="196" y2="-22"/>
          <line x1="94" y1="160" x2="234" y2="16"/>
        </g>
        <path d="M146 140 C 132 92, 110 50, 78 18 C 74 12, 80 8, 86 10 C 160 30, 214 66, 236 128 Z" fill="none" stroke="#111" stroke-width="22" stroke-linejoin="round"/>
      </g>
      <use href="#horn-l" transform="translate(512 0) scale(-1 1)"/>
    </g>

    <!-- Ears rotate around the point where they join the head. -->
    <g data-part="ear-l" data-pivot="124 215">
      <path d="M128 160 C 90 138, 32 156, 16 200 C 2 246, 20 290, 56 294 C 92 296, 116 276, 128 258 Z" fill="#fff" stroke="#111" stroke-width="22" stroke-linejoin="round"/>
      <path d="M30 236 C 28 268, 50 282, 76 278 C 98 274, 112 262, 118 248 C 92 254, 56 252, 30 236 Z" fill="#9a9a9a"/>
    </g>
    <g data-part="ear-r" data-pivot="388 215">
      <g transform="translate(512 0) scale(-1 1)">
        <path d="M128 160 C 90 138, 32 156, 16 200 C 2 246, 20 290, 56 294 C 92 296, 116 276, 128 258 Z" fill="#fff" stroke="#111" stroke-width="22" stroke-linejoin="round"/>
        <path d="M30 236 C 28 268, 50 282, 76 278 C 98 274, 112 262, 118 248 C 92 254, 56 252, 30 236 Z" fill="#9a9a9a"/>
      </g>
    </g>

    <g data-part="beard" data-pivot="256 470">
      <path d="M184 440 C 180 490, 188 524, 212 556 L234 532 L246 578 L262 594 L278 578 L290 532 L312 556 C 336 524, 344 490, 340 440 Z" fill="#fff" stroke="#111" stroke-width="22" stroke-linejoin="round"/>
      <path d="M228 480 L236 506 M296 480 L288 506" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>
    </g>

    <g data-part="head">
      <path d="M256 116 C 360 116, 404 150, 404 240 L404 318 C 404 420, 352 466, 256 466 C 160 466, 108 420, 108 318 L108 240 C 108 150, 152 116, 256 116 Z" fill="#fff" stroke="#111" stroke-width="22"/>
      <!-- Tuft: white fill covers the head outline, then its own outline on top. -->
      <path d="M214 140 L214 128 C 210 100, 215 78, 225 62 C 235 70, 240 78, 244 84 C 246 66, 250 52, 257 44 C 264 54, 268 66, 270 84 C 276 76, 284 68, 296 62 C 304 80, 304 104, 300 128 L300 140 Z" fill="#fff"/>
      <path d="M214 124 L214 128 C 210 100, 215 78, 225 62 C 235 70, 240 78, 244 84 C 246 66, 250 52, 257 44 C 264 54, 268 66, 270 84 C 276 76, 284 68, 296 62 C 304 80, 304 104, 300 128" fill="none" stroke="#111" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <g data-part="cheeks">
      <g data-variant="off"/>
      <g data-variant="on" fill="#f2a7b5" opacity="0.75">
        <ellipse cx="142" cy="304" rx="26" ry="15"/>
        <ellipse cx="370" cy="304" rx="26" ry="15"/>
      </g>
    </g>

    <g data-part="brows" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round">
      <g data-variant="none"/>
      <g data-variant="raised">
        <path d="M142 186 Q172 162 202 184"/>
        <path d="M310 184 Q340 162 370 186"/>
      </g>
      <g data-variant="sad">
        <path d="M142 200 Q170 194 200 178"/>
        <path d="M312 178 Q342 194 370 200"/>
      </g>
      <g data-variant="confused">
        <path d="M144 196 L200 196"/>
        <path d="M312 184 Q342 160 370 176"/>
      </g>
      <g data-variant="thinking">
        <path d="M144 192 Q172 184 200 192"/>
        <path d="M312 180 Q342 160 370 172"/>
      </g>
      <g data-variant="determined">
        <path d="M142 184 L200 198"/>
        <path d="M312 198 L370 184"/>
      </g>
    </g>

    <!-- Eyes. Variants inside [data-gaze] move a few units toward what the goat looks at. -->
    <g data-part="eyes">
      <g data-variant="happy" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round">
        <path d="M146 258 C 146 214, 198 214, 198 258"/>
        <path d="M314 258 C 314 214, 366 214, 366 258"/>
      </g>
      <g data-variant="open" data-gaze="">
        <g fill="#111"><ellipse cx="172" cy="238" rx="22" ry="29"/><ellipse cx="340" cy="238" rx="22" ry="29"/></g>
        <g fill="#fff"><circle cx="179" cy="228" r="7"/><circle cx="347" cy="228" r="7"/></g>
      </g>
      <g data-variant="wide" data-gaze="">
        <g fill="#111"><ellipse cx="172" cy="234" rx="25" ry="33"/><ellipse cx="340" cy="234" rx="25" ry="33"/></g>
        <g fill="#fff"><circle cx="180" cy="222" r="9"/><circle cx="348" cy="222" r="9"/><circle cx="164" cy="248" r="4"/><circle cx="332" cy="248" r="4"/></g>
      </g>
      <g data-variant="closed" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round">
        <path d="M146 244 Q172 254 198 244"/>
        <path d="M314 244 Q340 254 366 244"/>
      </g>
      <g data-variant="wink">
        <path d="M146 258 C 146 214, 198 214, 198 258" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round"/>
        <ellipse cx="340" cy="238" rx="22" ry="29" fill="#111"/>
        <circle cx="347" cy="228" r="7" fill="#fff"/>
      </g>
    </g>

    <g data-part="nose">
      <path d="M222 304 C 222 294, 240 293, 256 297 C 272 293, 290 294, 290 304 C 290 320, 272 332, 256 340 C 240 332, 222 320, 222 306 Z" fill="#111" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    </g>

    <!-- Mouths. The last group (viseme-*) are mouth shapes for talking. -->
    <g data-part="mouth">
      <g data-variant="smile"><path d="M176 318 C 186 400, 326 400, 336 318" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round"/></g>
      <g data-variant="small-smile"><path d="M210 358 Q256 394 302 358" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/></g>
      <g data-variant="grin">
        <path d="M180 348 Q256 360 332 348 C 326 428, 186 428, 180 348 Z" fill="#111" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
        <ellipse cx="256" cy="420" rx="46" ry="26" fill="#ef7f95" clip-path="url(#clip-grin)"/>
      </g>
      <g data-variant="neutral"><path d="M218 368 L294 368" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/></g>
      <g data-variant="frown"><path d="M206 392 Q256 350 306 392" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/></g>
      <g data-variant="wavy"><path d="M204 372 Q230 352 256 372 T308 372" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g data-variant="side"><path d="M232 372 Q270 374 302 354" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/></g>
      <g data-variant="o">
        <ellipse cx="256" cy="378" rx="24" ry="30" fill="#111"/>
        <ellipse cx="256" cy="396" rx="14" ry="9" fill="#ef7f95"/>
      </g>
      <g data-variant="viseme-a">
        <path d="M210 352 Q256 360 302 352 Q300 414 256 414 Q212 414 210 352 Z" fill="#111" stroke="#111" stroke-width="12" stroke-linejoin="round"/>
        <ellipse cx="256" cy="402" rx="24" ry="11" fill="#ef7f95"/>
      </g>
      <g data-variant="viseme-e">
        <path d="M198 356 Q256 366 314 356 Q302 392 256 392 Q210 392 198 356 Z" fill="#111" stroke="#111" stroke-width="12" stroke-linejoin="round"/>
        <ellipse cx="256" cy="386" rx="22" ry="6" fill="#ef7f95"/>
      </g>
      <g data-variant="viseme-o">
        <ellipse cx="256" cy="376" rx="20" ry="24" fill="#111"/>
        <ellipse cx="256" cy="390" rx="11" ry="7" fill="#ef7f95"/>
      </g>
      <g data-variant="viseme-u">
        <ellipse cx="256" cy="372" rx="13" ry="15" fill="#111"/>
      </g>
      <g data-variant="viseme-m"><path d="M222 364 Q256 372 290 364" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round"/></g>
    </g>
  </g>

  <!-- One hand, origin at the palm centre, fingers pointing toward +x.
       The controller copies it for each hand and mirrors the left one. -->
  <g id="hand-template" transform="translate(-200 -200)">
    <g data-pose="open">
      <use href="#hs-open" fill="#111" stroke="#111" stroke-width="20" stroke-linejoin="round"/>
      <use href="#hs-open" fill="#fff"/>
      <g fill="none" stroke="#111" stroke-width="8" stroke-linecap="round">
        <path d="M-20 -22 Q-26 0 -20 24"/>
        <path d="M56 4 L34 4"/>
      </g>
    </g>
    <g data-pose="point">
      <use href="#hs-point" fill="#111" stroke="#111" stroke-width="20" stroke-linejoin="round"/>
      <use href="#hs-point" fill="#fff"/>
      <g fill="none" stroke="#111" stroke-width="8" stroke-linecap="round">
        <path d="M-20 -18 Q-26 2 -20 26"/>
        <path d="M18 4 Q34 8 30 22"/>
        <path d="M88 -17 L76 -17"/>
      </g>
    </g>
    <g data-pose="grip">
      <use href="#hs-grip-back" fill="#111" stroke="#111" stroke-width="20" stroke-linejoin="round"/>
      <use href="#hs-grip-back" fill="#fff"/>
      <path d="M-20 -20 Q-26 0 -20 22" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
      <!-- A held prop is placed here, between the palm and the curled fingers. -->
      <g data-slot="held"/>
      <g data-grip-front="" fill="#fff" stroke="#111" stroke-width="10">
        <circle cx="32" cy="24" r="15"/>
        <circle cx="34" cy="0" r="15"/>
        <circle cx="32" cy="-24" r="15"/>
        <ellipse cx="10" cy="-36" rx="20" ry="12" transform="rotate(-15 10 -36)"/>
      </g>
    </g>
    <g data-pose="thumbs-up">
      <use href="#hs-thumbs-up" fill="#111" stroke="#111" stroke-width="20" stroke-linejoin="round"/>
      <use href="#hs-thumbs-up" fill="#fff"/>
      <g fill="none" stroke="#111" stroke-width="8" stroke-linecap="round">
        <path d="M-20 -18 Q-26 2 -20 26"/>
        <path d="M14 -4 L40 -4 M14 16 L40 16"/>
      </g>
    </g>
  </g>

  <!-- Sample props, each centred on 0,0. data-grip is where a hand holds it. -->
  <g id="props-library" transform="translate(-400 -400)">
    <g data-prop="apple" data-grip="0 38" data-label="omena">
      <path d="M0 -26 C -18 -44, -56 -40, -56 -2 C -56 34, -26 56, -12 50 C -6 47, 6 47, 12 50 C 26 56, 56 34, 56 -2 C 56 -40, 18 -44, 0 -26 Z" fill="#e5484d" stroke="#111" stroke-width="12" stroke-linejoin="round"/>
      <path d="M0 -26 Q2 -46 12 -56" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
      <path d="M10 -40 Q30 -62 48 -50 Q32 -30 10 -40 Z" fill="#46a758" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-34 -14 Q-36 -26 -26 -30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g data-prop="book" data-grip="0 34" data-label="kirja">
      <rect x="-48" y="-38" width="96" height="76" rx="8" fill="#3e63dd" stroke="#111" stroke-width="12" stroke-linejoin="round"/>
      <rect x="-48" y="26" width="96" height="12" fill="#f5f0e1" stroke="#111" stroke-width="8"/>
      <path d="M-24 -16 L24 -16 M-24 0 L12 0" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g data-prop="cup" data-grip="-4 30" data-label="kuppi">
      <path d="M36 -14 C 62 -16, 62 26, 32 22" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
      <path d="M-40 -32 L40 -32 L34 34 Q32 42 24 42 L-24 42 Q-32 42 -34 34 Z" fill="#f5c542" stroke="#111" stroke-width="12" stroke-linejoin="round"/>
      <path d="M-14 -46 Q-20 -56 -12 -64 M6 -46 Q0 -56 8 -64" fill="none" stroke="#999" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g data-prop="key" data-grip="-26 0" data-label="avain">
      <circle cx="-30" cy="0" r="22" fill="#e2b33a" stroke="#111" stroke-width="12"/>
      <circle cx="-30" cy="0" r="7" fill="#fff" stroke="#111" stroke-width="6"/>
      <path d="M-10 -9 L60 -9 L60 9 L54 9 L54 30 L40 30 L40 9 L32 9 L32 24 L18 24 L18 9 L-10 9 Z" fill="#e2b33a" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
